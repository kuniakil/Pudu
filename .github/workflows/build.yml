name: build

# 触发条件：push 任意分支 / PR / 手动触发
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # 不取消进行中的 run：macOS runner 排队较久，取消重排会白等
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 注意：GitHub 的 Apple Silicon label 是 macos-15 / macos-latest /
          # macos-26（macos-*-intel 才是 Intel 版），不存在 macos-*-arm64。
          - os: macos-15
            label: macos-arm64
            artifact: pudu-macos-arm64
            osx_arch: arm64
          # 保险：Intel runner 供给比 arm64 充裕得多。构建「通用二进制」
          # （arm64 + x86_64）：Intel runner 跑 x86_64 slice（可做 ctest/冒烟），
          # Apple Silicon 跑 arm64 slice。一个产物两用。
          - os: macos-15-intel
            label: macos-universal
            artifact: pudu-macos-universal
            osx_arch: "arm64;x86_64"
          - os: ubuntu-24.04
            label: linux-x64
            artifact: pudu-linux-x64
            osx_arch: ""

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ninja is available
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends ninja-build
            else
              brew install ninja
            fi
          fi

      # pugixml：优先用系统已安装版本（Linux apt / macOS brew）；
      # 都没有时 CMake 会自动回退到 FetchContent 源码拉取。
      - name: Install pugixml (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpugixml-dev

      - name: Configure
        run: |
          if [ -n "${{ matrix.osx_arch }}" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx_arch }}"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test (ctest)
        run: ctest --test-dir build --output-on-failure

      # 冒烟测试：无输入参数时应回退到内嵌样例并正常解析
      - name: Smoke test
        run: ./build/Pudu

      - name: Verify architecture
        if: runner.os == 'macOS'
        run: file build/Pudu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/Pudu
            tools/
          if-no-files-found: error
